<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="わくわくクイズ">
<meta name="theme-color" content="#4d9bff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>わくわくクイズ たんけんたい</title>
<style>
:root{--bg:linear-gradient(#bfe9ff,#e8f8ff);--ink:#2b2b3a;--card:#fff;--red:#ff6b6b;--blue:#4d9bff;--green:#3fbf6f;--orange:#ff9f2e;--purple:#9b6bff;--gold:#ffc41f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--bg);background-attachment:fixed;font-size:18px;line-height:1.6;overflow-x:hidden}
rt{font-size:.5em;font-weight:normal}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 70px}
.screen{display:none}.screen.on{display:block;animation:fadein .3s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-bottom:14px}
h1{font-size:24px;margin:0;text-align:center;letter-spacing:.03em}
h2{font-size:22px;margin:0 0 10px;text-align:center}
.topbar{display:flex;align-items:center;gap:8px}
.topbar h1{flex:1}
.iconbtn{background:#fff;border-radius:50%;width:48px;height:48px;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.iconbtn:active,.big:active,.choice:active,.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
/* あいぼう */
.buddy{display:flex;align-items:center;gap:12px}
.chara{position:relative;font-size:84px;line-height:1;width:110px;text-align:center;flex:none;animation:bob 2s ease-in-out infinite}
.chara .hat{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:44px}
.chara.jump{animation:jump .6s}
.chara.sad{animation:sad .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes jump{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-34px) rotate(-12deg)}60%{transform:translateY(0) rotate(10deg)}80%{transform:translateY(-12px)}100%{transform:none}}
@keyframes sad{0%,100%{transform:none}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.bubble{position:relative;background:#fff7d6;border-radius:16px;padding:8px 12px;font-size:16px;flex:1;min-height:52px}
.bubble:before{content:"";position:absolute;left:-10px;top:20px;border:8px solid transparent;border-right-color:#fff7d6;border-left:0}
.title{display:inline-block;background:var(--purple);color:#fff;border-radius:99px;padding:2px 14px;font-size:15px;font-weight:bold}
.bar{height:16px;background:#eee;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd84d,#ff8a3d);border-radius:99px;transition:width .8s}
.small{font-size:14px;color:#666}
.pts{display:flex;gap:8px;margin-top:8px}
.pts div{flex:1;background:#f3f6ff;border-radius:14px;text-align:center;padding:6px;font-size:14px}
.pts b{display:block;font-size:22px;color:#e2582b}
/* メニュー */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{border-radius:20px;padding:14px 8px;font-size:22px;font-weight:bold;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);min-height:92px;line-height:1.3}
.big span{display:block;font-size:34px}
.big small{display:block;font-size:13px;font-weight:normal;opacity:.95}
.c-kokugo{background:var(--red)}.c-sansu{background:var(--blue)}.c-rika{background:var(--green)}.c-shakai{background:var(--orange)}
.c-mix{background:linear-gradient(90deg,#ff6b6b,#ff9f2e,#3fbf6f,#4d9bff,#9b6bff)}.c-review{background:#7a8499}
.wide{grid-column:1/3;min-height:70px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.nav button{background:#fff;border-radius:16px;padding:10px 4px;font-size:15px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.nav button span{display:block;font-size:28px}
.reset{display:block;margin:18px auto 0;background:none;color:#778;font-size:13px;text-decoration:underline}
/* クイズ */
.qhead{display:flex;align-items:center;gap:8px;font-weight:bold}
.qhead .prog{flex:1}
.qhead .sc{background:#fff3c4;border-radius:99px;padding:4px 14px;font-size:20px;transition:transform .2s}
.qhead .sc.bump{transform:scale(1.35)}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{flex:1;height:10px;border-radius:99px;background:#e3e3ea}
.dots i.ok{background:var(--green)}.dots i.ng{background:#ffb199}.dots i.now{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.tbar{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a3d,#ffd84d,#7be07b);transform-origin:left}
.tbar i.run{animation:shrink 10s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.qcard{position:relative;font-size:23px;font-weight:bold;line-height:2;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.qcard .subj{position:absolute;top:-12px;left:14px;color:#fff;border-radius:99px;padding:0 12px;font-size:14px;line-height:1.9}
.qcard.gold{background:linear-gradient(135deg,#fff3a8,#ffd84d,#fff7c9,#ffc41f);box-shadow:0 6px 0 #c9960a,0 0 24px #ffe36b;animation:shine 1.6s infinite}
@keyframes shine{50%{box-shadow:0 6px 0 #c9960a,0 0 44px #fff1a0}}
.goldtag{display:none;font-size:15px;background:#e2582b;color:#fff;border-radius:99px;padding:0 12px;line-height:1.8;margin-bottom:4px}
.qcard.gold .goldtag{display:inline-block;animation:pop .5s}
.tg{font-size:1.5em;color:#d6336c;margin:0 4px}
.rainbow .qcard:not(.gold){box-shadow:0 0 0 5px #ff6b6b,0 0 0 10px #ffd84d,0 0 0 15px #3fbf6f,0 0 0 20px #4d9bff;animation:hue 1.5s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.rainbow #quizgap{height:22px}.rainbow #quizgap2{height:14px}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border-radius:18px;padding:10px 14px;font-size:21px;font-weight:bold;min-height:64px;line-height:1.8;box-shadow:0 5px 0 rgba(0,0,0,.15);border:3px solid transparent}
.choice .k{flex:none;width:38px;height:38px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.choice:nth-child(1) .k{background:var(--red)}.choice:nth-child(2) .k{background:var(--blue)}.choice:nth-child(3) .k{background:var(--green)}.choice:nth-child(4) .k{background:var(--orange)}
.choice.right{background:#dcffe4;border-color:var(--green);animation:pop .5s}
.choice.miss{background:#ffe9df;border-color:#ffb199}
.choice.dim{opacity:.45}
.choice[disabled]{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{display:none}.fb.on{display:block;animation:fadein .3s}
.fb .res{font-size:26px;font-weight:bold;text-align:center}
.fb .res.ok{color:#1c9b4c}.fb .res.ng{color:#e2582b}
.fb .bd{text-align:center;font-size:15px;color:#555;min-height:1.4em}
.fb .bd b{display:inline-block;background:#fff3c4;border-radius:99px;padding:0 10px;margin:2px}
.fb .ex{background:#f3f6ff;border-radius:14px;padding:10px 12px;font-size:17px;line-height:2;margin:8px 0}
.next{width:100%;background:var(--purple);color:#fff;font-size:22px;font-weight:bold;border-radius:18px;padding:12px;box-shadow:0 5px 0 #6a44c4}
.mini{display:flex;align-items:center;gap:8px;font-size:15px}
.mini .chara{font-size:46px;width:60px;animation:none}
.mini .chara .hat{font-size:24px;top:-12px}
.mini .chara.jump{animation:jump .6s}.mini .chara.sad{animation:sad .6s}
/* えんしゅつ */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.fly{position:fixed;z-index:60;font-size:34px;font-weight:bold;color:#ff7a00;text-shadow:0 2px 0 #fff,0 0 8px #fff;transform:translate(-50%,-50%) scale(1.4);transition:transform .7s cubic-bezier(.5,-.3,.7,1) .25s,opacity .7s .25s;pointer-events:none}
#combo{position:fixed;left:50%;top:26%;z-index:55;transform:translate(-50%,-50%) scale(0);font-size:44px;font-weight:bold;color:#fff;white-space:nowrap;text-shadow:0 0 6px #ff4d00,0 0 14px #ff4d00,3px 3px 0 #c22;pointer-events:none}
#combo.go{animation:comboin 1.1s}
@keyframes comboin{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}25%{transform:translate(-50%,-50%) scale(1.3) rotate(6deg)}40%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.1)}}
.flames{position:fixed;left:0;right:0;bottom:-12px;z-index:40;text-align:center;font-size:34px;letter-spacing:4px;white-space:nowrap;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .4s}
.flames.on{opacity:.8;animation:flick .5s infinite alternate}
@keyframes flick{to{transform:translateY(-8px) scale(1.04)}}
.overlay{position:fixed;inset:0;background:rgba(20,20,50,.75);z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.overlay .box{background:#fff;border-radius:26px;padding:22px;text-align:center;max-width:420px;width:100%;animation:boxin .6s}
@keyframes boxin{0%{transform:scale(0) rotate(-10deg)}70%{transform:scale(1.08)}100%{transform:none}}
.overlay .em{font-size:96px;line-height:1.2;animation:jump 1s infinite}
.overlay .hd{font-size:28px;font-weight:bold;color:#e2582b}
/* けっか */
.score{font-size:72px;font-weight:bold;text-align:center;color:#e2582b;line-height:1.2}
.stars{text-align:center;font-size:52px;letter-spacing:6px;min-height:70px}
.stars span{display:inline-block;opacity:.15;transform:scale(.5);transition:all .5s cubic-bezier(.3,2,.5,1)}
.stars span.on{opacity:1;transform:scale(1)}
.stat{display:flex;gap:8px}.stat div{flex:1;background:#f3f6ff;border-radius:14px;text-align:center;padding:6px;font-size:14px}.stat b{display:block;font-size:22px}
.newb{background:#fff7d6;border-radius:14px;padding:8px 12px;margin-top:10px;font-size:16px;animation:pop .6s}
/* バッジ・ショップ・カレンダー */
.blist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:#f3f6ff;border-radius:16px;text-align:center;padding:8px 4px;font-size:12px;line-height:1.4}
.badge .e{font-size:40px;line-height:1.3;display:block}
.badge b{display:block;font-size:13px}
.badge.off .e{filter:grayscale(1) brightness(0);opacity:.25}
.badge.off{color:#999}
.badge.on{background:#fff7d6;box-shadow:0 0 0 3px var(--gold) inset}
.item{display:flex;align-items:center;gap:10px;background:#f3f6ff;border-radius:16px;padding:8px 10px;margin-bottom:8px}
.item .pv{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:34px;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.item .nm{flex:1;font-weight:bold;font-size:17px}
.item button{border-radius:14px;padding:8px 12px;font-size:16px;font-weight:bold;color:#fff;background:var(--blue);box-shadow:0 4px 0 rgba(0,0,0,.2);min-width:104px}
.item button.use{background:var(--green)}.item button.cur{background:#bbb;box-shadow:none}.item button.no{background:#c9cfdd}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal div{aspect-ratio:1;border-radius:12px;background:#f3f6ff;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.cal .hd{background:none;font-weight:bold;aspect-ratio:auto;padding:2px}
.cal .st{background:#fff0f3}.cal .st:after{content:"💮";font-size:22px}
.cal .today{box-shadow:0 0 0 3px var(--gold) inset}
.cal .x{background:none}
.back{width:100%;background:#fff;border-radius:18px;padding:12px;font-size:20px;font-weight:bold;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="combo"></div>
<div class="flames" id="flames">🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥</div>

<div class="wrap">

<!-- ホーム -->
<section class="screen on" id="home">
  <div class="card topbar">
    <h1>🌟 わくわくクイズ<br>たんけんたい</h1>
    <button class="iconbtn" id="mute" aria-label="音のオン・オフ">🔊</button>
  </div>
  <div class="card">
    <div class="buddy">
      <div class="chara" id="chara"></div>
      <div style="flex:1">
        <div><span class="title" id="ttl"></span> <b id="cname"></b></div>
        <div class="bubble" id="say"></div>
      </div>
    </div>
    <div class="bar"><i id="lvbar"></i></div>
    <div class="small" id="lvtxt"></div>
    <div class="pts">
      <div>これまでにあつめた<b id="ptotal">0</b></div>
      <div>つかえるポイント<b id="pcoin">0</b></div>
    </div>
  </div>
  <div class="grid">
    <button class="big c-kokugo" data-m="kokugo"><span>📖</span>国語</button>
    <button class="big c-sansu" data-m="sansu"><span>🔢</span>算数</button>
    <button class="big c-rika" data-m="rika"><span>🔬</span>理科</button>
    <button class="big c-shakai" data-m="shakai"><span>🌏</span>社会</button>
    <button class="big c-mix wide" data-m="mix">🎲 ぜんぶミックス<small>4教科からまぜて出るよ</small></button>
    <button class="big c-review wide" data-m="review" id="revbtn">💪 にがてふくしゅう<small id="revtxt"></small></button>
  </div>
  <div style="height:14px"></div>
  <div class="nav">
    <button data-go="badges"><span>🏅</span>バッジ</button>
    <button data-go="calendar"><span>📅</span>スタンプ</button>
    <button data-go="shop"><span>👒</span>きせかえ</button>
  </div>
  <button class="reset" id="reset">きろくをぜんぶけす</button>
</section>

<!-- クイズ -->
<section class="screen" id="quiz">
  <div class="card">
    <div class="qhead">
      <button class="iconbtn" id="quit" aria-label="やめる" style="width:40px;height:40px;font-size:18px">✖</button>
      <div class="prog" id="prog"></div>
      <div class="sc">⭐ <span id="qscore">0</span></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="tbar"><i id="tbar"></i></div>
    <div class="small" style="text-align:center">はやく答えるとボーナス!(ゆっくりでも へらないよ)</div>
  </div>
  <div id="quizgap" style="height:8px"></div>
  <div class="card qcard" id="qcard">
    <span class="subj" id="qsubj"></span>
    <span class="goldtag">✨ ゴールドもんだい ポイント2ばい ✨</span>
    <div id="qtext"></div>
  </div>
  <div id="quizgap2"></div>
  <div class="choices" id="choices"></div>
  <div style="height:14px"></div>
  <div class="card fb" id="fb">
    <div class="mini"><div class="chara" id="qchara"></div><div class="bubble" id="qsay"></div></div>
    <div class="res" id="res"></div>
    <div class="bd" id="bd"></div>
    <div class="ex" id="ex"></div>
    <button class="next" id="next">つぎへ ▶</button>
  </div>
</section>

<!-- けっか -->
<section class="screen" id="result">
  <div class="card">
    <h2 id="rhead">けっかはっぴょう</h2>
    <div class="stars" id="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="score"><span id="rscore">0</span><span style="font-size:28px"> ポイント</span></div>
    <div class="stat">
      <div>せいかい<b id="rok"></b></div>
      <div>さいこうコンボ<b id="rcombo"></b></div>
      <div>はやおし<b id="rfast"></b></div>
    </div>
    <div id="rnew"></div>
  </div>
  <div class="row2">
    <button class="next" id="again">もう1回!</button>
    <button class="back" id="rhome">ホームへ</button>
  </div>
</section>

<!-- バッジ -->
<section class="screen" id="badges">
  <div class="card"><h2>🏅 バッジずかん <span id="bcount" class="small"></span></h2><div class="blist" id="blist"></div></div>
  <button class="back" data-go="home">もどる</button>
</section>

<!-- スタンプ -->
<section class="screen" id="calendar">
  <div class="card"><h2 id="calhead"></h2><div class="cal" id="cal"></div><p class="small" style="text-align:center" id="caltxt"></p></div>
  <button class="back" data-go="home">もどる</button>
</section>

<!-- きせかえ -->
<section class="screen" id="shop">
  <div class="card"><h2>👒 きせかえやさん</h2><div style="text-align:center">つかえるポイント <b id="scoin" style="font-size:26px;color:#e2582b"></b></div></div>
  <div class="card"><h2>あいぼうのぼうし</h2><div id="hats"></div></div>
  <div class="card"><h2>はいけい</h2><div id="bgs"></div></div>
  <button class="back" data-go="home">もどる</button>
</section>

</div>

<div class="overlay" id="ov"><div class="box"><div class="em" id="ovem"></div><div class="hd" id="ovhd"></div><p id="ovtx"></p><button class="next" id="ovok">やったー!</button></div></div>

<script>
/* ===== もんだいデータ:[もんだい, [せいかい, ちがう, ちがう, ちがう], かいせつ] ===== */
const Q={
/*Q-START*/
kokugo:[
["[[泳ぐ]] の読み方はどれ?",["およぐ","あそぶ","いそぐ","さわぐ"],"「泳ぐ」は「およぐ」。左がわの「さんずい」は、水にかんけいのある字につくよ。",1],
["[[運動]] の読み方はどれ?",["うんどう","うんてん","かつどう","じどう"],"「運動」は「うんどう」。「運」には「はこぶ」といういみもあるよ。",1],
["[[世界]] の読み方はどれ?",["せかい","せいかい","せけん","よかい"],"「世界」は「せかい」。せかいには、やく200の国があるんだって!",1],
["[[農家]] の読み方はどれ?",["のうか","のうけ","こうか","のうや"],"「農家」は「のうか」。お米ややさいを作るしごとをしている家のことだよ。",1],
["[[薬局]] の読み方はどれ?",["やっきょく","やくきょく","くすりや","やくば"],"「やく」と「きょく」がくっついて「やっきょく」。小さい「っ」になるよ。",1],
["[[急ぐ]] の読み方はどれ?",["いそぐ","およぐ","さわぐ","かせぐ"],"「急ぐ」は「いそぐ」。「きゅう」とも読んで、「きゅうきゅう車」の「きゅう」もこの字だよ。",1],
["[[悲しい]] の読み方はどれ?",["かなしい","うれしい","さびしい","くるしい"],"「悲しい」は「かなしい」。下に「心」があるね。気もちの字には「心」がよくつくよ。",1],
["[[病院]] の読み方はどれ?",["びょういん","びよういん","びょうき","いいん"],"「びょういん」は病気をなおすところ。「びよういん」はかみを切るところ。にているね!",1],
["「みずうみ」をかん字で書くとどれ?",["湖","海","池","波"],"「湖」が「みずうみ」。日本でいちばん大きいみずうみは、しがけんの「びわこ」だよ。",1],

  else{cx.font=p.s+'px serif';cx.fillText(p.ch,p.x,p.y)}});
 cx.globalAlpha=1;P=P.filter(p=>p.life>0&&p.y<cv.height+40);if(P.length)requestAnimationFrame(loop);else{looping=false;cx.clearRect(0,0,cv.width,cv.height)}}

  $('flames').classList.remove('on');document.body.classList.remove('rainbow');
  const qc=$('qcard');qc.classList.remove('shake');void qc.offsetWidth;qc.classList.add('shake');
  $('res').className='res ng';$('res').textContent='おしい!';bd='こたえは「'+fmt(q.ch[0])+'」だよ';
  $('qsay').textContent=pick(SAY_NG);
 }
 $('bd').innerHTML=bd;$('ex').innerHTML='💡 '+fmt(q.ex);
 $('qchara').innerHTML=charaHTML();
 $('next').textContent=G.i===G.qs.length-1?'けっかを見る 🎉':'つぎへ ▶';
 $('dots').children[G.i].className=ok?'ok':'ng';
 $('fb').classList.add('on');react($('qchara'),ok?'jump':'sad');save();
 setTimeout(()=>$('fb').scrollIntoView({behavior:'smooth',block:'nearest'}),350);
}
function finish(){
 const n=G.qs.length,perfect=G.ok===n,before=level(S.total);
 S.total+=G.score;S.coin+=G.score;S.plays++;
 const td=dstr(new Date());if(!S.days.includes(td))S.days.push(td);
 if(SUBJ[G.mode])S.played[G.mode]=1;
 const got=[];const give=id=>{if(!S.badges[id]){S.badges[id]=1;got.push(BADGES.find(b=>b.id===id))}};
 give('first');
 if(perfect&&n>=10&&SUBJ[G.mode])give('p_'+G.mode);
 if(perfect&&n>=10&&G.mode==='mix')give('p_mix');
 if(perfect&&G.mode==='review')give('review');
 if(SK.every(s=>S.played[s]))give('all4');
 if(G.max>=3)give('combo3');if(G.max>=5)give('combo5');if(G.max>=10)give('combo10');
 if(G.score>=200)give('high');if(G.fast>=5)give('fast');if(G.goldHit)give('gold');
 if(streakDays()>=3)give('day3');if(S.days.length>=7)give('day7');
 if(S.okN>=100)give('ok100');if(S.okN>=300)give('ok300');
 const after=level(S.total);if(after===LV.length-1)give('dragon');
 save();
 show('result');
 $('rhead').textContent=perfect?'🎊 ぜんもんせいかい! 🎊':G.ok>=n*.7?'すごい! よくできました':'おつかれさま! またちょうせんしよう';
 $('rok').textContent=G.ok+' / '+n;$('rcombo').textContent=G.max;$('rfast').textContent=G.fast+'回';
 $('rnew').innerHTML='';const st=[...$('stars').children];st.forEach(s=>s.classList.remove('on'));
 const nstar=perfect?3:G.ok>=n*.7?2:G.ok>=n*.4?1:0;
 $('rscore').textContent=0;SFX.drum(1300);
 countTo($('rscore'),0,G.score,1300,()=>{
  SFX.cymbal();confetti(perfect?220:G.ok>=n*.7?120:50);if(perfect)fireworks(6);
  st.forEach((s,i)=>{if(i<nstar)setTimeout(()=>{s.classList.add('on');tone(880+i*220,0,.2,'triangle',.2)},300+i*350)});
  setTimeout(()=>{
   $('rnew').innerHTML=got.map(b=>'<div class="newb">'+b.e+' あたらしいバッジ「<b>'+b.n+'</b>」をゲット!</div>').join('');
   if(got.length){SFX.gold();stars(cv.width/2,cv.height*.6,20)}
   if(after>before)setTimeout(()=>levelUp(before,after),got.length?1200:300);
  },300+nstar*350+300);
 });
}
function levelUp(a,b){$('ovem').innerHTML=LV[b].e;$('ovhd').textContent='しんかした!';$('ovtx').innerHTML=LV[a].e+' ➡ '+LV[b].e+'<br>あいぼうが「<b>'+LV[b].n+'</b>」になった!<br>しょうごうは「<b>'+LV[b].t+'</b>」';$('ov').classList.add('on');SFX.fanfare();confetti(200);fireworks(5)}

/* ===== バッジ・スタンプ・きせかえ ===== */
function renderBadges(){const n=BADGES.filter(b=>S.badges[b.id]).length;$('bcount').textContent=n+' / '+BADGES.length;
 $('blist').innerHTML=BADGES.map(b=>{const on=S.badges[b.id];return '<div class="badge '+(on?'on':'off')+'"><span class="e">'+b.e+'</span><b>'+(on?b.n:'???')+'</b>'+b.d+'</div>'}).join('')}
function renderCal(){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 $('calhead').textContent='📅 '+(m+1)+'月のスタンプ';let h='日月火水木金土'.split('').map(d=>'<div class="hd">'+d+'</div>').join('');
 for(let i=0;i<first;i++)h+='<div class="x"></div>';
 for(let d=1;d<=last;d++){const ds=dstr(new Date(y,m,d)),st=S.days.includes(ds);h+='<div class="'+(st?'st ':'')+(d===now.getDate()?'today':'')+'">'+d+'</div>'}
 $('cal').innerHTML=h;const sd=streakDays();$('caltxt').textContent='あそんだ日にスタンプがつくよ。ぜんぶで '+S.days.length+'こ'+(sd>=2?' / '+sd+'日れんぞく中!':'')}
function renderShop(){$('scoin').textContent=S.coin;
 const row=(it,type,pv)=>{const own=S.owned[it.id],cur=S[type]===it.id;let b;
  if(cur)b='<button class="cur" disabled>つかってる</button>';else if(own)b='<button class="use" data-use="'+it.id+'" data-t="'+type+'">つかう</button>';
  else b='<button class="'+(S.coin>=it.c?'':'no')+'" data-buy="'+it.id+'" data-t="'+type+'">'+it.c+' ポイント</button>';
  return '<div class="item">'+pv+'<div class="nm">'+it.n+'</div>'+b+'</div>'};
 $('hats').innerHTML=HATS.map(h=>row(h,'hat','<div class="pv" style="background:#fff">'+(h.e||'🚫')+'</div>')).join('');
 $('bgs').innerHTML=BGS.map(b=>row(b,'bg','<div class="pv" style="background:'+b.v+'"></div>')).join('')}
function shopClick(e){const b=e.target.closest('button');if(!b)return;const t=b.dataset.t,list=t==='hat'?HATS:BGS;
 if(b.dataset.buy){const it=list.find(x=>x.id===b.dataset.buy);if(S.coin<it.c){SFX.ng();b.textContent='あと'+(it.c-S.coin);setTimeout(renderShop,1200);return}
  S.coin-=it.c;S.owned[it.id]=1;S[t]=it.id;SFX.buy();confetti(60);if(!S.badges.shop){S.badges.shop=1;setTimeout(()=>{$('ovem').textContent='👒';$('ovhd').textContent='バッジをゲット!';$('ovtx').textContent='「おしゃれさん」のバッジをもらったよ';$('ov').classList.add('on');SFX.gold()},500)}}
 else if(b.dataset.use){S[t]=b.dataset.use;SFX.click()}else return;
 save();document.documentElement.style.setProperty('--bg',(BGS.find(x=>x.id===S.bg)||BGS[0]).v);renderShop()}

/* ===== ボタン ===== */
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{SFX.click();start(b.dataset.m)});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{SFX.click();show(b.dataset.go)});
$('choices').onclick=e=>{const b=e.target.closest('.choice');if(b)answer(+b.dataset.k,b)};
$('next').onclick=()=>{SFX.click();if(G.i<G.qs.length-1){G.i++;showQ()}else finish()};
$('quit').onclick=()=>{if(confirm('とちゅうでやめる?(このかいのポイントは入らないよ)')){save();show('home')}};
$('again').onclick=()=>{SFX.click();if(lastMode==='review'&&!Object.keys(S.wrong).length)show('home');else start(lastMode)};
$('rhome').onclick=()=>{SFX.click();show('home')};
$('ovok').onclick=()=>{$('ov').classList.remove('on');SFX.click()};
$('mute').onclick=()=>{S.mute=!S.mute;save();$('mute').textContent=S.mute?'🔇':'🔊';SFX.click()};
$('chara').onclick=()=>{react($('chara'),'jump');$('say').textContent=pick(SAY_HOME);SFX.click()};
$('hats').onclick=shopClick;$('bgs').onclick=shopClick;
$('reset').onclick=()=>{if(confirm('ポイントもバッジも ぜんぶきえるよ。ほんとうにけす?')&&confirm('もういちど かくにん。けしていい?')){try{localStorage.removeItem(KEY)}catch(e){}S=load();show('home')}};
renderHome();
</script>
</body>
</html>
